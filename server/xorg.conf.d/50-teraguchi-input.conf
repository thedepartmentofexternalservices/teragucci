# Teraguchi virtual input routing — adapted from PCoIP's 50-pcoip-evdev.conf.
#
# The server injects keyboard/mouse via uinput (kernel virtual devices). Because
# the headless Xorg config sets AutoAddDevices=false (so it never grabs random
# hotplugged devices), we explicitly bind Teraguchi's virtual devices here via
# InputClass, matching on their product names. This is the PCoIP pattern: don't
# auto-add everything, but do add *our* virtual devices with the right mode.
#
# Deployed to an isolated configdir (/etc/teraguchi/xorg.conf.d) and referenced
# with `Xorg -configdir`, so system/driver changes to /etc/X11/xorg.conf.d
# cannot conflict with it.

Section "InputClass"
    Identifier      "teraguchi keyboard"
    MatchIsKeyboard "on"
    MatchProduct    "Teraguchi"
    Driver          "libinput"
    Option          "GrabDevice" "off"
EndSection

Section "InputClass"
    Identifier      "teraguchi absolute pointer"
    MatchIsPointer  "on"
    MatchProduct    "Teraguchi"
    Driver          "libinput"
    Option          "Mode" "Absolute"
EndSection

Section "InputClass"
    Identifier      "teraguchi tablet"
    MatchProduct    "Teraguchi"
    MatchDevicePath "/dev/input/event*"
    Driver          "libinput"
EndSection
